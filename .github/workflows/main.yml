name: 'gitbook-publish'
on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Deploy
        uses: cowtrix/github-pages-blog-action
        with:
          branch: gh-pages # Optional branch for GitHub Pages